name: EMA Signal Alert

on:
  schedule:
    - cron: "3 * * * *"      # har ghante, 3rd minute par (candle close ke baad)
  workflow_dispatch:
    inputs:
      test_email:
        description: "Sirf test mail bhejo"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ema-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run indicator
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TEST_MAIL: ${{ inputs.test_email && '1' || '0' }}
          PHASE_OFFSET: ${{ vars.PHASE_OFFSET || '0' }}
        run: python indicator_alert.py

      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase && git push)
